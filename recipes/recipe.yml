name: lizi-coreos-server
description: Lizi ServerOS (Optimized for Auto-Updates)

base-image: quay.io/fedora/fedora-coreos
image-version: stable

modules:
  - type: repos
    yum:
      - https://pkgs.tailscale.com/stable/fedora/tailscale.repo

  - type: rpm-ostree
    install:
      - moby-engine
      - docker-compose
      - tailscale
      - fastfetch

  - type: systemd
    system:
      enabled:
        - docker.service
        - tailscaled.service
        - zincati.service

  - type: script
    snippets:
      - |
        ln -sf /usr/share/zoneinfo/Asia/Bangkok /etc/localtime
        echo "Asia/Bangkok" > /etc/timezone
