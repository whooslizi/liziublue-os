name: lizi-coreos-server
description: Lizi ServerOS (Monday 3 AM Maintenance Window)

base-image: quay.io/fedora/fedora-coreos
image-version: stable

modules:
  - type: script
    snippets:
      - |
        curl -Lo /etc/yum.repos.d/tailscale.repo https://pkgs.tailscale.com/stable/fedora/tailscale.repo
        
        # Setup Zincati Maintenance
        # This replaces the buggy 'files' module
        mkdir -p /etc/zincati/config.d
        cat > /etc/zincati/config.d/50-maintenance-window.toml <<EOF
        [updates]
        strategy = "periodic"

        [[updates.periodic.window]]
        days = [ "Mon" ]
        start_time = "03:00"
        length_minutes = 60
        EOF

  - type: rpm-ostree
    install:
      - moby-engine
      - docker-compose
      - tailscale
      - fastfetch

  - type: systemd
    system:
      enabled:
        - docker.service
        - tailscaled.service
        - zincati.service

  - type: script
    snippets:
      - |
        # 3. Timezone setup
        ln -sf /usr/share/zoneinfo/Asia/Bangkok /etc/localtime
        echo "Asia/Bangkok" > /etc/timezone
