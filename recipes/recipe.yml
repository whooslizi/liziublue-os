name: lizi-coreos
description: Lizi CoreOS (bare minimum supplies for my server)

base-image: quay.io/fedora/fedora-coreos
image-version: stable

modules:
  - type: rpm-ostree
    install:
      - moby-engine
      - docker-compose
      - tailscale
      - wireguard-tools
      - tmux
      - fastfetch

  - type: systemd
    system:
      enabled:
        - docker.service
        - tailscaled.service
        - zincati.service

  - type: script
    scripts:
      - |
        ln -sf /usr/share/zoneinfo/Asia/Bangkok /etc/localtime
        echo "Asia/Bangkok" > /etc/timezone
