name: lizi-coreos-server
description: Lizi CoreOS Server

base-image: quay.io/fedora/fedora-coreos
image-version: stable

modules:
  - type: script
    snippets:
      - |
        set -eux

        curl -fsSL \
          https://pkgs.tailscale.com/stable/fedora/tailscale.repo \
          -o /etc/yum.repos.d/tailscale.repo

        ln -snf /usr/share/zoneinfo/Asia/Ho_Chi_Minh /etc/localtime

  - type: rpm-ostree
    install:
      - moby-engine
      - docker-compose
      - tailscale
      - fastfetch

  - type: script
    snippets:
      - |
        set -eux

        install -Dm755 /dev/stdin /usr/local/bin/lizi-bootc-update <<'EOF'
        #!/usr/bin/env bash
        set -euo pipefail

        bootc upgrade
        rpm-ostree cleanup -m || true
        EOF

        install -Dm755 /dev/stdin /usr/local/bin/lizi-weekly-reboot <<'EOF'
        #!/usr/bin/env bash
        set -euo pipefail

        # Wait (max 30 min) if the upgrade is still running
        for _ in $(seq 1 180); do
            systemctl is-active --quiet lizi-bootc-update.service || break
            sleep 10
        done

        systemctl reboot
        EOF

        install -Dm644 /dev/stdin /etc/systemd/system/lizi-bootc-update.service <<'EOF'
        [Unit]
        Description=Weekly bootc upgrade
        Wants=network-online.target
        After=network-online.target

        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/lizi-bootc-update
        EOF

        install -Dm644 /dev/stdin /etc/systemd/system/lizi-bootc-update.timer <<'EOF'
        [Unit]
        Description=Weekly bootc upgrade (Mon 02:50)

        [Timer]
        OnCalendar=Mon *-*-* 02:50:00 Asia/Ho_Chi_Minh
        Persistent=true

        [Install]
        WantedBy=timers.target
        EOF

        install -Dm644 /dev/stdin /etc/systemd/system/lizi-reboot.service <<'EOF'
        [Unit]
        Description=Weekly reboot

        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/lizi-weekly-reboot
        EOF

        install -Dm644 /dev/stdin /etc/systemd/system/lizi-reboot.timer <<'EOF'
        [Unit]
        Description=Weekly reboot (Mon 03:00)

        [Timer]
        OnCalendar=Mon *-*-* 03:00:00 Asia/Ho_Chi_Minh
        Persistent=false

        [Install]
        WantedBy=timers.target
        EOF

  - type: systemd
    system:
      enabled:
        - docker.service
        - tailscaled.service
        - lizi-bootc-update.timer
        - lizi-reboot.timer
      disabled:
        - zincati.service
