name: lizi-coreos-server
description: Lizi CoreOS Server

base-image: quay.io/fedora/fedora-coreos
image-version: stable

modules:
  - type: script
    snippets:
      - |
        set -eux

        curl -fsSL \
          https://pkgs.tailscale.com/stable/fedora/tailscale.repo \
          -o /etc/yum.repos.d/tailscale.repo

        ln -snf /usr/share/zoneinfo/Asia/Ho_Chi_Minh /etc/localtime
        echo "Asia/Ho_Chi_Minh" >/etc/timezone

        mkdir -p /etc/zincati/config.d

        cat >/etc/zincati/config.d/50-maintenance-window.toml <<'EOF'
        [updates]
        strategy = "periodic"

        [[updates.periodic.window]]
        days = ["Mon"]
        start_time = "03:00"
        length_minutes = 60
        EOF

  - type: rpm-ostree
    install:
      - moby-engine
      - docker-compose
      - tailscale
      - fastfetch

  - type: script
    snippets:
      - |
        install -Dm755 /dev/stdin /usr/local/bin/lizi-bootc-update <<'EOF'
        #!/usr/bin/env bash
        set -euo pipefail

        bootc upgrade || true
        rpm-ostree cleanup -m || true
        rpm-ostree cleanup -p || true
        EOF

        install -Dm755 /dev/stdin /usr/local/bin/lizi-reboot-if-staged <<'EOF'
        #!/usr/bin/env bash
        set -euo pipefail

        if bootc status | grep -q "Staged: yes"; then
            systemctl reboot
        fi
        EOF

        install -Dm644 /dev/stdin /etc/systemd/system/lizi-bootc-update.service <<'EOF'
        [Unit]
        Description=Weekly Bootc Upgrade

        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/lizi-bootc-update
        EOF

        install -Dm644 /dev/stdin /etc/systemd/system/lizi-bootc-update.timer <<'EOF'
        [Unit]
        Description=Weekly Bootc Upgrade

        [Timer]
        OnCalendar=Mon 02:45
        Persistent=true

        [Install]
        WantedBy=timers.target
        EOF

        install -Dm644 /dev/stdin /etc/systemd/system/lizi-reboot.service <<'EOF'
        [Unit]
        Description=Reboot if staged

        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/lizi-reboot-if-staged
        EOF

        install -Dm644 /dev/stdin /etc/systemd/system/lizi-reboot.timer <<'EOF'
        [Unit]
        Description=Weekly Reboot

        [Timer]
        OnCalendar=Mon 03:00
        Persistent=true

        [Install]
        WantedBy=timers.target
        EOF

  - type: systemd
    system:
      enabled:
        - docker.service
        - tailscaled.service
        - zincati.service
        - lizi-bootc-update.timer
        - lizi-reboot.timer
