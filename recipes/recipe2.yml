name: lizi-desktop
description: Lizi's UBlueOS (for my Linux PC)

base-image: quay.io/fedora/fedora-silverblue
image-version: 40

modules:
  - type: rpm-ostree
    install:
      - moby-engine
      - docker-compose
      - tailscale
      - fastfetch
      - distrobox
      - policycoreutils
      - policycoreutils-python-utils
      - git
      - vim
      - htop
      - btop
      - plymouth
      - plymouth-system-theme-spinner
      - fish
      - starship
      
  - type: systemd
    system:
      enabled:
        - docker.service
        - tailscaled.service

  - type: default-flatpaks
    configurations:
      - scope: system
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
          title: Flathub
        install:
          - org.localsend.localsend_app
