name: lizi-desktop
description: Lizi's UBlueOS (for my Linux PC)

base-image: quay.io/fedora/fedora-silverblue
image-version: 40

modules:
  - type: rpm-ostree
    install:
      - moby-engine
      - docker-compose
      - tailscale
      - fastfetch
      - distrobox
      - policycoreutils
      - policycoreutils-python-utils
      - git
      - vim
      - htop
      - btop
      
  - type: systemd
    system:
      enabled:
        - docker.service
        - tailscaled.service

  - type: script
    snippets:
      - |
        cat <<EOF > /etc/profile.d/fcitx5-env.sh
        export XMODIFIERS=@im=fcitx
        export QT_IM_MODULE=fcitx
        export QT_IM_MODULES="wayland;fcitx"
        export GLFW_IM_MODULE=fcitx
        EOF

        mkdir -p /etc/xdg/autostart
        cp /usr/share/applications/org.fcitx.Fcitx5.desktop /etc/xdg/autostart/ || true

  - type: default-flatpaks
    configurations:
      - scope: system
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
          title: Flathub
        install:
          - com.spotify.Client
          - org.localsend.localsend_app
